/* Moderators, invitations and people sent away (XPRS.md 10.10). The
   administrator appoints, dismisses and lifts; a moderator sees the lists. */
function drawModeration(d,isAdmin){
  if(d.role===undefined)return '';
  stationCall=d.station||stationCall;
  myStationRole=d.role;myOffer=d.offer||'';
  var h='';
  if(d.role==='invited'&&d.offer)
    h+='<h3>Moderation</h3><div class="card"><p class="lead">You were asked to moderate this '+
      'station&rsquo;s rooms: delete messages and send people away.</p>'+
      '<div class="frow"><button class="act primary" id="ad-accept" onclick="acceptModerator()">Accept</button></div></div>';
  /* An administrator who does not moderate (claimed before moderation, or
     declined it): the station appoints them, and the page accepts. */
  if(isAdmin&&d.role==='none')
    h+='<h3>Moderation</h3><div class="card"><p class="lead">You administer this station but do not '+
      'moderate its rooms.</p><div class="frow"><button class="act" id="ad-selfmod" '+
      'onclick="adminDo(\'appoint\',{call:baseCall(mycall)})">Moderate as well</button></div></div>';
  if(!d.moderators)return h;
  var i,rows=function(a,btn){
    if(!a.length)return '<div class="empty">none</div>';
    var t='<div class="roster">';
    for(i=0;i<a.length;i++){
      var c=typeof a[i]==='string'?a[i]:a[i].call;
      var note=a[i].until?'until '+esc(a[i].until.slice(0,16).replace('T',' '))+' UTC':
               (typeof a[i]==='string'?'':'until lifted');
      t+='<div class="row">'+callLink(c)+
        (note?'<span class="pill">'+note+'</span>':'')+'<span class="sp"></span>'+
        (isAdmin&&btn?'<button class="act quiet" onclick="adminDo(\''+btn[0]+'\',{call:\''+esc(c)+'\'})">'+btn[1]+'</button>':'')+
        '</div>';
    }
    return t+'</div>';
  };
  h+='<h3>Moderators</h3><div class="card">'+rows(d.moderators,['dismiss','Dismiss']);
  if(d.invited&&d.invited.length)
    h+='<div class="lead" style="margin-top:8px">Asked, not yet accepted: '+d.invited.map(callLink).join(', ')+'</div>';
  if(isAdmin)h+='<div class="frow"><input id="ad-newmod" class="grow" placeholder="Callsign" '+
    'style="text-transform:uppercase"><button class="act" onclick="adminAppoint()">Appoint a moderator</button></div>';
  h+='</div><h3>Sent away</h3><div class="card">'+rows(d.away||[],['lift','Lift'])+'</div>';
  return h;
}
// ---- rooms this station hosts (XPRS.md 10.10.1) ---------------------------
//
// Closed groups whose key the station holds: the administrator creates them
// (public or private, anyone or members posting), adds members and appoints
// moderators; the station signs those acts as the room. Members accept with
// their own signature (10.3.1). Traffic stays on the station.
var canRooms=false,hostedRooms=[],hostedByCall={},roomAccepting={};
function loadRooms(cb){
  if(!canRooms)return;
  getJSON('/api/rooms'+(sess?'?session='+encodeURIComponent(sess):''),function(d){
    if(!d||!d.rooms)return;
    hostedRooms=d.rooms;hostedByCall={};
    for(var i=0;i<d.rooms.length;i++){var hr=d.rooms[i];hostedByCall[hr.call]=hr;
      /* The administrator moderates every room: the role the station offers
       * on each is accepted as it comes, once. */
      if(isStationAdmin&&hr.role==='invited'&&hr.offer&&!roomAccepting[hr.call]){
        roomAccepting[hr.call]=1;acceptRoom(hr.call,hr.offer,hr.offer_role||'mod');}
    }
    renderSide();
    if(curRoom.slice(0,2)==='g:')switchRoom(curRoom);
    if(curRoom.slice(0,2)==='f:')forumComposer();
    if(cb)cb(d.rooms);
  });
}
function loadHosted(){
  if(curRoom.slice(0,2)!=='g:')return;
  var call=curRoom.slice(2);
  getJSON('/api/xprs/history?kind=message,reaction&room='+encodeURIComponent(call)+
          '&limit=100'+(sess?'&session='+encodeURIComponent(sess):''),function(d){
    if(!d||!d.rows)return;
    /* Removals are by packet id; who a ROOM sent away is the room's own. */
    if(d.moderation)applyModeration({removed:d.moderation.removed||[],away:Object.keys(modAway)});
    var rows=d.rows.slice().reverse();
    for(var i=0;i<rows.length;i++)render(rows[i]);
  });
}
function acceptRoom(call,offer,role){
  sendIdentity();
  signAny('t:moderate f:'+mycall+' d:'+call+' ts:'+tsNow()+' r:'+offer+
          ' accept:'+(role==='mod'?'mod':'member'),function(w){
    if(!w)return snack('Not signed');
    postWire(w,function(ok,why){
      if(!ok)return snack(why||'The station refused it');
      if(!isStationAdmin)snack('Joined '+roomLabel('g:'+call));
      loadRooms(function(){if(tab==='admin')loadAdmin();});
    });
  });
}
function roomPost(b,done){
  b.session=sess;
  var x=new XMLHttpRequest();
  x.open('POST','/api/rooms',true);x.timeout=6000;
  x.onload=function(){
    var j=null;try{j=JSON.parse(x.responseText);}catch(e){}
    if(x.status===200&&j&&j.ok)loadRooms(function(){if(tab==='admin')loadAdmin();if(done)done(j);});
    else snack(j&&j.error||('HTTP '+x.status));
  };
  x.onerror=x.ontimeout=function(){snack('The station did not answer');};
  x.send(JSON.stringify(b));
}
function roomCreate(){
  roomCreateFrom('rn-',el('rn-kind').value,function(){snack('Room created');});
}
/* Create a room from the fields prefix+name/about/vis/post: the admin's New
 * room form, or the Forum's own category panel. done(room json) on success. */
function roomCreateFrom(prefix,kind,done){
  var name=(el(prefix+'name').value||'').trim();
  if(!name)return snack(kind==='forum'?'A category needs a name':'A room needs a name');
  roomPost({action:'create',name:name,about:(el(prefix+'about').value||'').trim(),
            visibility:el(prefix+'vis').value,posting:el(prefix+'post').value,kind:kind},function(j){
    /* The station offered us its moderator role: accept it now. */
    var hr=hostedByCall[j.room];
    if(hr&&hr.role==='invited'&&hr.offer)acceptRoom(hr.call,hr.offer,hr.offer_role||'mod');
    if(done)done(j);
  });
}
function roomDo(action,call){
  var m=(el('rm-'+call).value||'').trim().toUpperCase();
  if(!m)return snack('A callsign, please');
  roomPost({action:action,call:call,member:m},function(){
    snack(action==='add'?'Asked '+m+' to join':action==='appoint'?'Asked '+m+' to moderate':m+' removed');});
}
function roomSet(call){
  roomPost({action:'update',call:call,visibility:el('rv-'+call).value,posting:el('rp-'+call).value},
           function(){snack('Saved');});
}
function roomRename(call){
  var hr=hostedByCall[call],name=prompt('Room name:',hr?hr.name:'');
  if(name===null)return;
  var about=prompt('About (optional):',hr?hr.about||'':'');
  if(about===null)return;
  roomPost({action:'update',call:call,name:name.trim(),about:about.trim()},function(){snack('Saved');});
}
function roomClose(call){
  if(!confirm('Close '+roomLabel('g:'+call)+'? The station stops serving it.'))return;
  roomPost({action:'close',call:call},function(){snack('Room closed');});
}
function drawRooms(){
  var h='<h3>Rooms this station hosts</h3>',i;
  var pills=function(label,a){
    return '<span class="pill'+(a&&a.length?' on':'')+'">'+label+': '+(a&&a.length?a.map(callLink).join(', '):'none')+'</span>';};
  for(i=0;i<hostedRooms.length;i++){
    var r=hostedRooms[i],c=esc(r.call),priv=r.visibility==='private';
    h+='<div class="card roomcard" data-call="'+c+'">'+
      '<div class="frow first"><b>'+esc(r.name)+'</b><span class="pill">'+c+'</span>'+
        '<span class="pill'+(priv?' on':'')+'">'+(priv?'&#128274; private':'public')+'</span>'+
        '<span class="pill">'+(r.posting==='anyone'?'anyone posts':'members post')+'</span>'+
        (r.kind==='forum'?'<span class="pill">forum</span>':'')+
        (r.mirrored?'<span class="pill on" title="a copy of a room another station holds (XPRS.md 10.10.1)">mirrored from '+esc(r.owner||'')+'</span>':'')+
        (r.shared?'<span class="pill on">shared</span>':'')+

       '<div class="frow"><label class="opt"><input type="checkbox" id="rs-'+c+'"'+(r.shared?' checked':'')+'> Shared with other stations</label>'+
          '<input id="rsp-'+c+'" class="grow" placeholder="Peer stations, e.g. X3ABCD X3EFGH (empty: any station may mirror a public room)" value="'+esc((r.peers||[]).join(' '))+'" style="text-transform:uppercase">'+
          '<button class="act" onclick="roomShare(\''+c+'\')">Save sharing</button></div>'+
          (r.shared&&r.seen&&r.seen.length?'<div class="pills">'+pills('Mirrored by',r.seen)+'</div>':''))+

      (r.mirrored?'<button class="act danger" onclick="roomUnmirror(\''+c+'\')">Stop mirroring</button>':
                  '<button class="act danger" onclick="roomClose(\''+c+'\')">Close room</button>')+'</div></div>';
  }
  h+='<div class="card"><h4>New room</h4>'+
     '<div class="frow first"><input id="rn-name" class="grow" placeholder="Room name">'+
     '<input id="rn-about" class="grow" placeholder="About (optional)"></div>'+
     '<div class="frow"><select id="rn-vis"><option value="public">Public: everyone reads</option>'+
     '<option value="private">Private: members only</option></select>'+
     '<select id="rn-post"><option value="anyone">Anyone posts</option><option value="members">Members post</option></select>'+
     '<select id="rn-kind"><option value="chat">Chat: a conversation</option><option value="forum">Forum: topics and comments</option></select>'+
     '<span class="sp"></span><button class="act primary" onclick="roomCreate()">Create room</button></div>'+
     '<p class="lead" style="margin-top:10px">A room is a closed group this station holds the key of: '+
     'its messages stay here and are never put on the air, unless you share it with named stations.</p></div>';
  h+='<div class="card"><h4>Mirror a room from another station</h4>'+
     '<div class="frow first"><input id="mr-call" class="grow" placeholder="Room callsign (X5…)" style="text-transform:uppercase">'+
     '<input id="mr-owner" class="grow" placeholder="Station that holds it (X3…)" style="text-transform:uppercase">'+
     '<input id="mr-name" class="grow" placeholder="Name shown here (optional)">'+
     '<span class="sp"></span><button class="act primary" onclick="roomMirror()">Mirror</button></div>'+
     '<p class="lead" style="margin-top:10px">This station keeps a copy of a room the other station shared with it (XPRS.md 10.10.1): '+
     'the two ask each other for what the other filed, every minute when there is news. '+
     'Its record rules here; this station never signs as the room.</p></div>';
  return h;
}
function roomShare(call){
  var peers=(el('rsp-'+call).value||'').toUpperCase().split(/[\s,]+/).filter(function(x){return x;});
  var shared=el('rs-'+call).checked,hr=hostedByCall[call];
  /* Private means served to members, not secret (XPRS.md 10.10.1): shared,
   * the other stations' operators can read it too. Said before it is done. */
  if(shared&&hr&&hr.visibility==='private'&&!hr.shared){
    if(!peers.length)return snack('A private room is shared with named stations');
    if(!confirm('This room is private: its members read it, and so can you. Shared with '+peers.join(', ')+
                ', the operators of those stations can read it as well. Share it?'))return;
  }
  roomPost({action:'share',call:call,shared:shared,peers:peers},function(){snack('Sharing saved');});
}
function roomMirror(){
  var call=(el('mr-call').value||'').trim().toUpperCase(),owner=(el('mr-owner').value||'').trim().toUpperCase();
  if(!call||!owner)return snack('The room\u2019s callsign and the station that holds it');
  roomPost({action:'mirror',call:call,owner:owner,name:(el('mr-name').value||'').trim()},function(){snack('Mirroring '+call+' from '+owner);});
}
function roomUnmirror(call){
  if(!confirm('Stop mirroring this room? What was filed stays.'))return;
  roomPost({action:'unmirror',call:call},function(){snack('No longer mirrored');});
}

// ---- forum (XPRS.md 18.5): a hosted room of posts --------------------------
// A forum room is a station room (10.10.1) whose posts are t:blog: a titled
// post opens a topic, replaced by a later one of the same title from its
// author (18.1); an untitled post naming it with r: is a comment. The station
// keeps the room's index (/api/rooms?topics=) and a topic's thread
// (history root=); the page shows topics as cards and a thread as the opening
// post with its comments beneath, and the composer replies while one is open.
var forumTopic=null,forumAt=0;
function forumRoom(){return curRoom.slice(0,2)==='f:'?hostedByCall[curRoom.slice(2)]:null;}
// ---- the round + of a feed: what the visitor may add here -----------------
// A feed is read; what there is to add (a post, an alert, a forum category)
// opens as a panel at the top of it, and the feed's refresh leaves the panel

var fabMode=null;
function fabSet(m){
  fabMode=m;var f=el('fab');if(!f)return;

}
function fabClick(){

  if(!h)return;

  box.insertAdjacentHTML('afterbegin','<div id="composer">'+h+'</div>');
  el('fab').className='fab hide'; /* out of the way of the panel's buttons */

function closeComposer(){
  var c=el('composer');if(c)c.parentNode.removeChild(c);
  fabSet(fabMode);

  else if(curRoom==='blog')loadBlogFeed(true);
  else if(curRoom==='forum')loadForumIndex(true);

/* A post to everybody (XPRS.md 18): a title that becomes a label (18.1) and
 * up to about 1500 characters, split into parts past one packet (7.6). */
function blogForm(){
  return '<div class="card composer"><h4>Write a post</h4>'+
    '<div class="frow first"><input id="bl-title" class="grow" maxlength="60" placeholder="Title"></div>'+
    '<div class="frow"><textarea id="bl-text" maxlength="1600" placeholder="Your post"></textarea></div>'+
    '<div class="frow"><span class="sp"></span><button class="act quiet" onclick="closeComposer()">Cancel</button>'+
    '<button class="act primary" onclick="blogPublish()">Publish</button></div></div>';

function blogPublish(){
  var title=slugOf(el('bl-title').value),text=(el('bl-text').value||'').trim().replace(/[\x00-\x1f]+/g,' ');
  if(!title)return snack('A post needs a title');

  splitSigned(head,text,function(wires,why){
    if(!wires)return snack(why||'Not signed');
    postWires(wires,0,function(ok,why2){

/* A forum category is a forum room (XPRS.md 10.10.1, 18.5), the
 * administrator's to create; the station's key signs it. */
function categoryForm(){
  return '<div class="card composer"><h4>New forum category</h4>'+
    '<div class="frow first"><input id="fc-name" class="grow" placeholder="Name">'+
    '<input id="fc-about" class="grow" placeholder="About (optional)"></div>'+
    '<div class="frow"><select id="fc-vis"><option value="public">Public: everyone reads</option>'+
    '<option value="private">Private: members only</option></select>'+
    '<select id="fc-post"><option value="anyone">Anyone posts</option><option value="members">Members post</option></select>'+
    '<span class="sp"></span><button class="act quiet" onclick="closeComposer()">Cancel</button>'+

/* The Forum entry: its categories as cards, one click to open. */
var forumIndexAt=0;
function forumCards(list){
  var h='',i;

    h+='<div class="alert cat" data-r="f:'+esc(hr.call)+'" onclick="switchRoom(\'f:'+esc(hr.call)+'\')">'+
      '<div class="l1"><span>'+esc(hr.name)+'</span>'+
      (hr.visibility==='private'?'<span class="lock" title="private: members only">&#128274;</span>':'')+

function loadForumIndex(force){

  var draw=function(){

function forumComposer(){
  var hr=forumRoom(),t=el('txt');
  if(!hr)return;
  if(!forumTopic){t.disabled=true;t.placeholder='Open a topic to reply';return;}
  t.disabled=!hr.can_post;
  t.placeholder=hr.can_post?'Reply in '+forumTopic.title.replace(/-/g,' '):
    (!sess?'Prove your key to post (menu, top right)':
     'Only members post in '+hr.name);
}
/* A label (XPRS.md 18.1): lowercase letters, digits and dashes. */
function slugOf(t){return (t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40).replace(/-+$/,'');}
/* Up to nine parts of at most 250 bytes, split at spaces (7.6), signed once
 * over the whole and carried on the last part (9.1.1). cb(wires) or
 * cb(null, why). A post that fits one packet is signed as one. */
function splitSigned(head,text,cb){
  var canonical=head+' m:'+text;
  if(u8(canonical).length+65<=250){signAny(canonical,function(w,why){cb(w?[w]:null,why);});return;}
  var per=250-u8(head).length-6-65-3;        /* n:i/k, sig:, m: */
  if(per<24)return cb(null,'Too long a head for a split post');
  var words=text.split(' '),parts=[],cur='',i;
  for(i=0;i<words.length;i++){
    if(u8(words[i]).length>per)return cb(null,'A word too long for one packet');
    var next=cur?cur+' '+words[i]:words[i];
    if(u8(next).length>per){parts.push(cur);cur=words[i];}else cur=next;
  }
  if(cur)parts.push(cur);
  if(parts.length>9)return cb(null,'Too long: a post is at most nine packets, about '+(9*per)+' characters here');
  signAny(canonical,function(signed,why){
    if(!signed)return cb(null,why);
    var m=signed.match(/ sig:([!-~]{60})/);
    if(!m)return cb(null,'Not signed');
    var k=parts.length,out=[],j;
    for(j=0;j<k;j++)out.push(head+' n:'+(j+1)+'/'+k+(j===k-1?' sig:'+m[1]:'')+' m:'+parts[j]);
    cb(out);
  });
}
/* One after another: the station holds the parts until the last arrives. */
function postWires(wires,i,cb){
  if(i>=wires.length)return cb(true);
  postWire(wires[i],function(ok,why){if(!ok)return cb(false,why);postWires(wires,i+1,cb);});
}
function forumNewTopic(){
  var hr=forumRoom();if(!hr)return;
  var title=slugOf(el('ft-title').value),text=(el('ft-text').value||'').trim().replace(/[\x00-\x1f]+/g,' ');
  if(!title)return snack('A topic needs a title');
  if(!text)return snack('Write the post first');
  if(!canSign())return snack('Not ready');
  sendIdentity();
  var head='t:blog f:'+mycall+' d:'+hr.call+' ts:'+tsNow()+' title:'+title;
  splitSigned(head,text,function(wires,why){
    if(!wires)return snack(why||'Not signed');
    postWires(wires,0,function(ok,why2){
      if(!ok)return snack(why2||'The station refused it');
      el('ft-title').value='';el('ft-text').value='';
      snack('Topic posted');loadForum(true);
    });
  });
}
function forumReply(text){
  var hr=forumRoom();if(!hr||!forumTopic)return;
  var head='t:blog f:'+mycall+' d:'+hr.call+' ts:'+tsNow()+' r:'+forumTopic.id;
  splitSigned(head,text,function(wires,why){
    if(!wires)return snack(why||'Not signed');
    postWires(wires,0,function(ok,why2){
      if(!ok)return snack(why2||'The station refused it');
      loadForum(true);
    });
  });
}
/* The author withdraws a post (7.8.2); a room moderator takes one down (10.10). */
function forumWithdraw(id){
  var hr=forumRoom();if(!hr)return;
  if(!confirm('Withdraw this post?'))return;
  signAny('t:blog f:'+mycall+' d:'+hr.call+' ts:'+tsNow()+' r:'+id+' remove:blog',function(w){
    if(!w)return snack('Not signed');
    postWire(w,function(ok,why){
      if(!ok)return snack(why||'The station refused it');
      snack('Withdrawn');if(forumTopic&&forumTopic.id===id)forumTopic=null;loadForum(true);
    });
  });
}
function forumRemove(id){
  var hr=forumRoom();if(!hr)return;
  if(!confirm('Delete this post for everyone? This cannot be undone.'))return;
  signAny('t:moderate f:'+mycall+' d:'+hr.call+' ts:'+tsNow()+' r:'+id+' remove:message',function(w){
    if(!w)return snack('Not signed');
    postWire(w,function(ok,why){
      if(!ok)return snack(why||'The station refused it');
      snack('Deleted');if(forumTopic&&forumTopic.id===id)forumTopic=null;loadForum(true);
    });
  });
}
function openTopic(id,title){forumTopic={id:id,title:title};forumComposer();el('msgs').innerHTML='';loadForum(true);}
function closeTopic(){forumTopic=null;forumComposer();el('msgs').innerHTML='';loadForum(true);}
function topicForm(hr){
  if(!hr.can_post)return '<div class="card"><p class="lead">'+
    (!sess?'Prove your key (menu, top right) to open a topic or reply.':
     'Only members of '+esc(hr.name)+' open topics and reply.')+'</p></div>';
  return '<div class="card" id="topicform"><h4>New topic</h4>'+
    '<div class="frow first"><input id="ft-title" class="grow" maxlength="60" placeholder="Title (becomes a label: balun-question)"></div>'+
    '<div class="frow"><textarea id="ft-text" maxlength="1600" placeholder="Your post: up to about 1500 characters, signed by you"></textarea></div>'+
    '<div class="frow"><span class="sp"></span><button class="act primary" onclick="forumNewTopic()">Post topic</button></div></div>';
}
function topicCards(list){
  var h='',now=Math.floor(Date.now()/1000),i;
  if(!list.length)return '<div class="card"><div class="empty">No topics yet.</div></div>';
  for(i=0;i<list.length;i++){var t=list[i];
    h+='<div class="alert post topic" data-id="'+esc(t.id)+'" onclick="openTopic(\''+esc(t.id)+'\',\''+esc(t.title)+'\')">'+
      '<div class="l1"><span>'+esc((t.title||'').replace(/-/g,' '))+'</span>'+
      (t.edited?'<span class="pill">edited</span>':'')+
      '<span class="sp"></span><span class="when">'+(t.last?esc(ago(now-t.last))+' ago':'')+'</span></div>'+
      '<div class="l2">'+callLink(t.from||'')+
      '<span>'+t.replies+(t.replies===1?' reply':' replies')+'</span>'+
      (t.tags?t.tags.split(',').map(function(x){return '<span class="pill">'+esc(x)+'</span>';}).join(''):'')+
      '</div></div>';
  }

}
/* A post as a card: the opening post with its title, or a comment. */
function postCard(p,op){
  var hr=forumRoom(),now=Math.floor(Date.now()/1000);
  var own=baseCall(p.from)===baseCall(mycall),mod=hr&&hr.role==='mod';
  var badge=p.sig==='verified'?'<span class="badge ok">signed</span>':(p.sig==='none'?'<span class="badge bad">unsigned</span>':'');
  return '<div class="alert post'+(op?' op':'')+'" data-id="'+esc(p.id)+'">'+
    '<div class="l1"><span>'+(op?esc((p.title||'').replace(/-/g,' ')):esc(p.from))+'</span>'+badge+
    (p.edited?'<span class="pill">edited</span>':'')+
    '<span class="sp"></span><span class="when">'+(p.ts?esc(ago(now-p.ts))+' ago':'')+'</span></div>'+
    '<div class="body">'+esc(p.text)+'</div>'+
    '<div class="l2">'+(op?callLink(p.from):'')+
    (p.tags?p.tags.split(',').map(function(x){return '<span class="pill">'+esc(x)+'</span>';}).join(''):'')+
    '<span class="sp"></span>'+
    (own?'<button class="act quiet" onclick="forumWithdraw(\''+esc(p.id)+'\')">Withdraw</button>':
     mod?'<button class="act quiet" onclick="forumRemove(\''+esc(p.id)+'\')">Delete</button>':'')+
    '</div></div>';
}
function loadForum(force){
  var hr=forumRoom();if(!hr)return;
  var t=Date.now();
  if(!force&&t-forumAt<15000)return;
  forumAt=t;
  var q=sess?'&session='+encodeURIComponent(sess):'';
  var here='f:'+hr.call;
  if(!forumTopic){
    getJSON('/api/rooms?topics='+encodeURIComponent(hr.call)+q,function(d){
      if(!d||!d.ok||curRoom!==here||forumTopic)return;
      var note=hr.mirrored?'<div class="roomnote">A copy of a room '+esc(hr.owner||'')+' holds, kept in step with it.</div>':
               hr.shared?'<div class="roomnote">Shared with other stations'+(hr.peers&&hr.peers.length?': '+esc(hr.peers.join(', ')):'')+'.</div>':'';
      el('msgs').innerHTML='<div class="roomnote"><button class="act quiet" onclick="switchRoom(\'forum\')">&#8592; Forum</button> '+esc(hr.name)+
        (hr.about?' <span class="dim">'+esc(hr.about)+'</span>':'')+'</div>'+note+topicForm(hr)+topicCards(d.topics||[]);
    });
    return;
  }
  var want=forumTopic.id;
  getJSON('/api/xprs/history?room='+encodeURIComponent(hr.call)+'&kind=blog&root='+encodeURIComponent(want)+'&limit=200'+q,function(d){
    if(!d||!d.rows||curRoom!==here||!forumTopic||forumTopic.id!==want)return;
    if(d.moderation)applyModeration({removed:d.moderation.removed||[],away:Object.keys(modAway)});
    var posts=blogPosts(d.rows),i,top=null,comments=[];
    for(i=0;i<posts.length;i++){
      if(modRemoved[posts[i].id])continue;
      if(posts[i].title){if(!top)top=posts[i];}
      else comments.push(posts[i]);
    }
    comments.sort(function(a,b){return a.ts-b.ts;});
    el('msgs').innerHTML='<div class="roomnote"><button class="act quiet" onclick="closeTopic()">&#8592; Topics</button> '+esc(hr.name)+'</div>'+
      (top?postCard(top,true):'<div class="card"><div class="empty">This topic is gone.</div></div>')+
      comments.map(function(c){return postCard(c,false);}).join('');
    var box=el('msgs');box.scrollTop=box.scrollHeight;
  });
}
// ---- blog (XPRS.md 18): the posts the station holds, newest first --------
// A post is a t:blog packet: published, kept, listed and read later by people
// who were not listening when it went out. A long one arrives split (7.6) and
// the archive files the parts as it heard them, so the page joins them here,
// keyed on (f, ts) as 6.6 says, and a set with a part missing is not shown.
// A later post from the same author with the same title: replaces the
// earlier one (18.1): that is how a post is corrected.
var blogs=[],blogSeen={},blogAt=0;
try{var _bs=stGet('xprs_blog_seen');if(_bs)blogSeen=JSON.parse(_bs);}catch(e){}
/* One value from a wire's head (before m:), or ''. */
function headField(w,key){
  var mi=w.indexOf(' m:'),head=(mi>=0?w.slice(0,mi):w)+' ';
  var m=head.match(new RegExp(' '+key+':([^ ]+) '));return m?m[1]:'';}
/* History rows -> posts: parts joined, the newest edition per author and
 * title, newest first. Each: {id,from,ts,title,tags,file,text,edited,sig}. */
function blogPosts(rows){
  var sets={},order=[],i,r,w;
  for(i=0;i<rows.length;i++){r=rows[i];w=r.wire||'';
    if(w.indexOf('t:blog ')!==0||/ remove:/.test(w))continue;
    var n=headField(w,'n'),idx=1,of=1;
    if(n){var nm=/^([1-9])\/([1-9])$/.exec(n);if(!nm)continue;idx=+nm[1];of=+nm[2];if(idx>of)continue;}
    var key=baseCall(r.from||'')+'|'+headField(w,'ts');
    if(!sets[key]){sets[key]={row:r,of:of,parts:{},got:0};order.push(key);}
    var s=sets[key];
    /* The whole, filed by a station that joined the parts itself, outranks them. */
    if(!n&&s.of>1){s.of=1;s.parts={};s.got=0;s.row=r;}
    if(of!==s.of||s.parts[idx])continue;      /* a mixed or repeated part */
    var mi=w.indexOf(' m:');
    s.parts[idx]=mi>=0?w.slice(mi+3):'';s.got++;
    if(idx===1)s.row=r;                        /* the head carries title:, tag:, file: */
  }
  var byTitle={},list=[];
  for(i=0;i<order.length;i++){var st=sets[order[i]];
    if(st.got<st.of||!st.parts[1])continue;    /* a hole: never shown (6.6) */
    var text=[],k;for(k=1;k<=st.of;k++)text.push(st.parts[k]);
    w=st.row.wire||'';
    /* The identifier is the packet the parts reassemble into (7.6): the head
     * without n:, the joined text. A comment names that, never a part. */
    var wholeW=st.of>1?w.replace(/ n:[1-9]\/[1-9]/,'').replace(/ m:[\s\S]*$/,'')+' m:'+text.join(' '):w;
    var p={id:wireId(wholeW),from:st.row.from||'',ts:st.row.ts||0,
           title:headField(w,'title'),tags:headField(w,'tag'),file:headField(w,'file'),
           text:text.join(' '),edited:false,sig:st.row.sig||''};
    if(p.title){var tk=baseCall(p.from)+'|'+p.title,q=byTitle[tk];
      if(q){if(q.ts>=p.ts){q.edited=true;continue;}
            p.edited=true;list.splice(list.indexOf(q),1);}
      byTitle[tk]=p;}
    list.push(p);
  }
  list.sort(function(a,b){return b.ts-a.ts;});
  return list;
}

var alerts={},alertsSeen={},alertTimer=null,alertPolicy='moderators';

function parseTs(s){
  var m=/^(\d{4})-(\d\d)-(\d\d)_(\d\d):(\d\d):(\d\d)$/.exec(s||'');
  if(!m)return 0;
  return Math.floor(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6])/1000);}
/* Active from ts: until until:, or for a day without one. */
function alertUntil(w,ts){var m=w.match(/ until:(\S+)/);var u=m?parseTs(m[1]):0;return u||((ts||0)+86400);}
function pollAlerts(cb){
  getJSON('/api/xprs/history?kind=warning,info&limit=100',function(d){
    if(!d||!d.rows)return;
    var now=Math.floor(Date.now()/1000),withdrawn={},active={},i,r,w;
    for(i=0;i<d.rows.length;i++){r=d.rows[i];w=r.wire||'';
      var rm=w.match(/ r:([0-9a-f]{6}) remove:(warning|info)/);if(rm)withdrawn[rm[1]]=1;}
    for(i=0;i<d.rows.length;i++){r=d.rows[i];w=r.wire||'';
      if(/ remove:/.test(w))continue;
      var id=r.id||wireId(w);
      if(withdrawn[id]||alertUntil(w,r.ts)<now)continue;
      active[id]={id:id,row:r};}
    alerts=active;
    if(tab==='chat'&&curRoom==='alerts')markAlertsSeen();
    var a=el('alertsroom');

function canAlert(){return alertPolicy==='everyone'||myStationRole==='mod'||isStationAdmin;}
var ALERT_KINDS=['fire','flood','storm','wind','snow','ice','quake','tsunami','landslide',
                 'chemical','radiation','outage','road','crowd','animal','other'];
function alertForm(){

  var kinds=[];for(var i=0;i<ALERT_KINDS.length;i++)kinds.push([ALERT_KINDS[i],ALERT_KINDS[i].charAt(0).toUpperCase()+ALERT_KINDS[i].slice(1)]);

    '<div class="frow first">'+

    '<div class="frow"><input id="al-text" class="grow" placeholder="What is happening"></div>'+

/* The alerts, newest first, as cards. */
function alertCards(){
  var h='',now=Math.floor(Date.now()/1000),list=[],k,i;
  for(k in alerts)list.push(alerts[k]);
  list.sort(function(a,b){return (b.row.ts||0)-(a.row.ts||0);});
  if(!list.length)return '<div class="card"><div class="empty">No active alerts.</div></div>';
  {

      var typ=w.indexOf('t:info ')===0?'info':'warning',sev=typ==='info'?'notice':(f('sev')||'watch');

function postAlert(){

  var hours=parseInt(el('al-hours').value,10)||24;
  var text=(el('al-text').value||'').trim().replace(/[\x00-\x1f]/g,' ');

           ' ts:'+tsNow()+' until:'+tsAt(Date.now()+hours*3600000);

function withdrawAlert(id,typ){

function adminDo(action,extra){
  var b={action:action,session:sess},k;
  for(k in (extra||{}))b[k]=extra[k];
  var x=new XMLHttpRequest();
  x.open('POST','/api/admin',true);
  x.timeout=6000;
  x.onload=function(){
    var j=null;try{j=JSON.parse(x.responseText);}catch(e){}
    if(x.status===200&&j&&j.ok){
      drawAdmin(j);
      snack(action==='claim'?'You are this station\u2019s administrator':
            action==='release'?'Administration given up':
            action==='appoint'?'Asked '+extra.call+' to moderate':
            action==='dismiss'?extra.call+' no longer moderates':
            action==='lift'?extra.call+' may post again':'Saved');
      /* The administrator moderates too: accept the role the station offered. */
      if((action==='claim'||(action==='appoint'&&extra.call===baseCall(mycall)))&&
         j.role==='invited'&&j.offer){myOffer=j.offer;acceptModerator();}
    }else{snack(j&&j.error||('HTTP '+x.status));loadAdmin();}
  };
  x.onerror=x.ontimeout=function(){snack('The station did not answer');};
  x.send(JSON.stringify(b));
}

// ---- moderation of this station's rooms (XPRS.md 10.10) --------------------
//
// The station is the group of its own rooms: `d:` is its callsign. A
// moderator signs here, in the browser, and posts the act like any wire:
// `r:<id> remove:message` deletes a message, `revoke:<call> [until:]` sends
// somebody away. Appointing, dismissing and lifting are the administrator's,
// which the station signs (/api/admin). A message gone, or an author sent
// away, is taken off every page that shows them.
var stationCall='',canModerate=false,myStationRole='none',myOffer='';
var modRemoved={},modAway={};
var SAFETY={sos:1,warning:1,info:1};
function applyModeration(m){
  var i,ch=false,box=el('msgs'),k;
  for(i=0;i<(m.removed||[]).length;i++)
    if(!modRemoved[m.removed[i]]){modRemoved[m.removed[i]]=1;ch=true;}
  var away={};
  for(i=0;i<(m.away||[]).length;i++)away[m.away[i]]=1;
  for(k in away)if(!modAway[k])ch=true;
  for(k in modAway)if(!away[k])ch=true;
  modAway=away;
  if(!ch)return;
  var kids=box.querySelectorAll('.msg');
  for(i=0;i<kids.length;i++){
    var d=kids[i];
    if(modRemoved[d.getAttribute('data-id')]||modAway[d.getAttribute('data-from')])
      d.parentNode.removeChild(d);
  }
}
function loadMyRole(){
  if(!sess)return;
  getJSON('/api/admin?session='+encodeURIComponent(sess),function(d){
    if(!d||!d.ok)return;
    if(d.station)stationCall=d.station;
    myStationRole=d.role||'none';
    var was=isStationAdmin;isStationAdmin=!!d.you;stationHasAdmin=!!d.admin;
    if(isStationAdmin&&!was&&canRooms)loadRooms();
    if(curRoom==='forum')fabSet(isStationAdmin?'category':null);
    if(curRoom==='alerts')fabSet(canAlert()?'alert':null);
    myOffer=d.offer||'';
    if(myStationRole==='invited'&&myOffer&&!adminInvitedSaid){
      adminInvitedSaid=true;
      snack('You were asked to moderate '+stationCall+': see Administration');
    }
  });
}
var adminInvitedSaid=false,isStationAdmin=false,stationHasAdmin=false;
function tsAt(ms){
  var d=new Date(ms),p=function(n){return (n<10?'0':'')+n;};
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+
    '_'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
/* Sign a t:moderate about this station's rooms and post it. */
function modAct(body,done){
  if(!stationCall||!canSign())return snack('Not ready yet');
  signAny('t:moderate f:'+mycall+' d:'+stationCall+' ts:'+tsNow()+' '+body,function(w){
    if(!w)return snack('Not signed');
    postWire(w,function(ok,why){
      if(!ok){snack(why||'The station refused it');return;}
      if(done)done();
    });
  });
}
function modDelete(id){
  if(!confirm('Delete this message for everyone? This cannot be undone.'))return;
  modAct('r:'+id+' remove:message',function(){
    applyModeration({removed:[id],away:Object.keys(modAway)});
    snack('Deleted');
  });
}
function modSendAway(call,secs){
  var c=baseCall(call);
  var until=secs?' until:'+tsAt(Date.now()+secs*1000):'';
  modAct('revoke:'+c+until,function(){
    var a=Object.keys(modAway);a.push(c);
    applyModeration({removed:[],away:a});
    snack(c+' was sent away'+(secs?'':' until lifted'));
    if(tab==='admin')loadAdmin();

}
function acceptModerator(){
  if(!myOffer)return;
  modAct('r:'+myOffer+' accept:mod',function(){
    snack('You moderate '+stationCall+' now');
    myOffer='';loadMyRole();setTimeout(loadAdmin,500);

}
function adminAppoint(){
  var c=(el('ad-newmod').value||'').trim().toUpperCase();
  if(!c)return;
  adminDo('appoint',{call:c});
}
function adminRelease(){
  if(!confirm('Give up administration of this station?'))return;
  adminDo('release');
}

// ---- boot: an identity before the first keystroke, the extension first ----
(function(){
  var saved=stGet('xprs_nsec');
  var b=saved?nsecDecode(saved):null;
  /* A returning visitor's key is used at once. A new one gets a key only
     once it is clear there is no extension to offer (below). */
  if(b)useKey(b);else el('call').textContent='\u2026';
  renderSide();
  switchRoom(curRoom);
  load();
  tabTimer=setInterval(tick,TAB_MS.chat);
  getJSON('/api/services',applyServices);
  /* The alerts count in the tab, whatever tab is open: once, then every
     thirty seconds (one small request; an alert read late is worth less). */
  pollAlerts();loadBlogFeed();
  alertTimer=setInterval(function(){pollAlerts();loadBlogFeed();},30000);
  /* An extension injects `window.nostr` a moment after the page starts:
     look for it for 3 s. Chosen before: use it. Declined before: the page's
     key. Never asked: ask. No extension: the page's key, made now if new. */
  var tries=0,tm=setInterval(function(){
    showExtButton();
    var choice=stGet('xprs_ext');
    if(nostrAvailable()){
      clearInterval(tm);
      if(choice==='1'){if(!extMode)useExtension(true,function(){if(!priv)useKey(randKey());});}
      else if(choice==='0'||choice===''){if(!priv)useKey(randKey());} /* '' = declined, older pages */
      else askExtension();
    }else if(++tries>12){
      clearInterval(tm);
      if(!priv&&!extMode)useKey(randKey());
    }
  },250);
})();
// See the html/body rule in the stylesheet: the document is parked one
// pixel down so Android's captive-portal browser does not take a scroll-up
// inside a panel for a pull-to-refresh. Load, resize (the keyboard) and any
// scroll that lands on 0 put it back.
function park(){
  var y=window.scrollY!==undefined?window.scrollY:document.documentElement.scrollTop;
  if(y<1)window.scrollTo(0,1);
}
// The page ends where what is visible ends: the visual viewport, which a
// toolbar lying over the page shortens (not while pinch-zoomed, when it is
// the zoomed window). And a WebView that draws under the system bars but
// reports no safe-area insets (WebViews before edge-to-edge support) is told
// the Android bars' heights: the tell is a page as tall as the whole screen,
// which a browser that keeps clear of the bars never is. A measured inset
// always wins over the guess.
function fit(){
  var de=document.documentElement,vv=window.visualViewport;
  var lay=window.innerHeight;
  var vis=vv&&Math.abs(vv.scale-1)<0.01?vv.height:lay;
  if(lay>0){
    de.style.setProperty('--lay-h',lay+'px');
    de.style.setProperty('--cut',Math.max(0,Math.round(lay-vis))+'px');
  }
  var under=('ontouchstart' in window)&&window.screen&&
            window.innerHeight>=window.screen.height-2;
  if(under&&!insetBottom()){
    de.style.setProperty('--sab','48px');de.style.setProperty('--sat','24px');
  }else{
    de.style.removeProperty('--sab');de.style.removeProperty('--sat');
  }
  park();
}
// The bottom inset the browser reports, in px. A custom property computes
// to its text ("env(...)"), so it is read off a real padding.
var insetProbe=null;
function insetBottom(){
  if(!insetProbe){
    insetProbe=document.createElement('div');
    insetProbe.style.cssText='position:fixed;visibility:hidden;'+
      'padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(insetProbe);
  }
  return parseFloat(getComputedStyle(insetProbe).paddingBottom)||0;
}
window.addEventListener('load',fit);
window.addEventListener('resize',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
window.addEventListener('scroll',park,{passive:true});
fit();
